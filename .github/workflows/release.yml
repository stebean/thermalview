name: Build & Release Single-File Linux Binary

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish Single-File Binary
        run: |
          dotnet publish src/Thermalview.Cli/Thermalview.Cli.csproj \
            -c Release \
            -p:PublishSingleFile=true \
            -o publish/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thermalview-linux-x64
          path: publish/thermalview

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/thermalview
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
